[defaults]
inventory = inventory/hosts.yml
interpreter_python = auto_silent
retry_files_enabled = False
host_key_checking = True
timeout = 30
forks = 5
callbacks_enabled = ansible.posix.profile_tasks

[privilege_escalation]
become = True
become_method = sudo

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=30 -o ServerAliveCountMax=4 -o StrictHostKeyChecking=accept-new

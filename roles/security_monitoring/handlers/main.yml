---
- name: Reload security monitoring units
  ansible.builtin.systemd_service:
    daemon_reload: true
- name: Restart Vector
  ansible.builtin.systemd_service:
    name: platform-vector.service
    state: restarted
- name: Restart Falco
  ansible.builtin.systemd_service:
    name: platform-falco.service
    state: restarted

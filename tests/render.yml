        trivy_site_src: "{{ trivy_sources_raw.results[4].content | b64decode }}"

    - name: Require each Trivy service to stay in its rootless account
      ansible.builtin.assert:
        that:
          - "'User=' ~ item.value.name in trivy_rendered_service"
          - "'Group=' ~ item.value.name in trivy_rendered_service"
          - "'HOME=/var/lib/' ~ item.value.name in trivy_rendered_service"
          - "'XDG_RUNTIME_DIR=/run/user/' ~ (item.value.uid | string) in trivy_rendered_service"
          - "'/run/user/' ~ (item.value.uid | string) ~ '/podman/podman.sock' in trivy_rendered_service"
          - "'/var/log/trivy/' ~ item.value.name in trivy_rendered_service"
          - "'NoNewPrivileges=true' in trivy_rendered_service"
      vars:
        trivy_rendered_service: "{{ trivy_service_raw.results[trivy_test_index].content | b64decode }}"
      loop: "{{ service_accounts | dict2items }}"
      loop_control:
        index_var: trivy_test_index
        label: "{{ item.value.name }}"

    - name: Require each Trivy timer to be persistent and randomized
      ansible.builtin.assert:
        that:

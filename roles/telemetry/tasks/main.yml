---
- name: Download the pinned OpenTelemetry Collector Contrib package
  ansible.builtin.get_url:
    url: >-
      https://github.com/open-telemetry/opentelemetry-collector-releases/releases/download/v{{ otelcol_version
      }}/otelcol-contrib_{{ otelcol_version }}_linux_{{ preflight_platform_arch }}.deb
    dest: "/usr/local/src/otelcol-contrib_{{ otelcol_version }}_linux_{{ preflight_platform_arch }}.deb"
    checksum: "sha256:{{ artifact_checksums.otelcol_deb[preflight_platform_arch] }}"
    owner: root
    group: root
    mode: "0644"

- name: Install OpenTelemetry Collector Contrib
  ansible.builtin.apt:
    deb: "/usr/local/src/otelcol-contrib_{{ otelcol_version }}_linux_{{ preflight_platform_arch }}.deb"
    state: present

- name: Grant the host collector read-only journal access
  ansible.builtin.user:
    name: otelcol-contrib
    groups: systemd-journal
    append: true

- name: Create durable host collector cursor storage
  ansible.builtin.file:
    path: /var/lib/otelcol-contrib/storage
    state: directory
    owner: otelcol-contrib
    group: otelcol-contrib
    mode: "0750"

- name: Configure host OTLP ingest, metrics, journal, security logs, and Prometheus scraping
  ansible.builtin.template:
    src: host-otelcol.yml.j2
    dest: /etc/otelcol-contrib/config.yaml
    owner: root
    group: otelcol-contrib
    mode: "0640"
  notify: Restart host OpenTelemetry collector

- name: Configure a least-privilege Podman stats collector for each account
  ansible.builtin.template:
    src: podman-otelcol.yml.j2
    dest: "/var/lib/{{ item.value.name }}/.config/otelcol-podman.yml"
    owner: "{{ item.value.name }}"
    group: "{{ item.value.name }}"
    mode: "0600"
  loop: "{{ service_accounts | dict2items }}"
  notify: Restart Podman OpenTelemetry collectors

- name: Install per-account Podman stats collector units
  ansible.builtin.template:
    src: otelcol-podman.service.j2
    dest: "/etc/systemd/system/otelcol-podman-{{ item.value.name }}.service"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ service_accounts | dict2items }}"
  notify:
    - Reload systemd for telemetry
    - Restart Podman OpenTelemetry collectors

- name: Validate the host collector configuration
  ansible.builtin.command: /usr/bin/otelcol-contrib validate --config=/etc/otelcol-contrib/config.yaml
  changed_when: false

- name: Apply telemetry unit changes
  ansible.builtin.meta: flush_handlers

- name: Enable the host OpenTelemetry collector
  ansible.builtin.systemd_service:
    name: otelcol-contrib.service
    enabled: true
    state: started

- name: Enable per-account Podman stats collectors
  ansible.builtin.systemd_service:
    name: "otelcol-podman-{{ item.value.name }}.service"
    enabled: true
    state: started
  loop: "{{ service_accounts | dict2items }}"

- name: Create libexec for the SigNoz alert helper
  ansible.builtin.file:
    path: /usr/local/libexec
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create the SigNoz alert config directory
  ansible.builtin.file:
    path: /etc/signoz
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the SigNoz alert upsert helper
  ansible.builtin.copy:
    src: upsert-alerts.py
    dest: /usr/local/libexec/platform-signoz-alerts
    owner: root
    group: root
    mode: "0755"

- name: Render SigNoz operations alert rules
  ansible.builtin.template:
    src: alerts.json.j2
    dest: /etc/signoz/platform-alerts.json
    owner: root
    group: root
    mode: "0640"

- name: Warn when SigNoz alert rules cannot be applied
  ansible.builtin.debug:
    msg: >-
      signoz_api_token is empty. Collection is running; managed disk,
      ClickHouse, collector, unit-failure, and Traefik alerts were not
      upserted. Create an API key in SigNoz and rerun --tags telemetry.
  when: signoz_api_token | default('') | length == 0

- name: Apply managed SigNoz operations alerts
  when: signoz_api_token | default('') | length > 0
  block:
    - name: Confirm the SigNoz API belongs to the running rootless container
      ansible.builtin.command:
        argv:
          - /usr/bin/podman
          - inspect
          - signoz-signoz-0
      become: true
      become_user: "{{ service_accounts.signoz.name }}"
      environment:
        HOME: "/var/lib/{{ service_accounts.signoz.name }}"
        XDG_RUNTIME_DIR: "/run/user/{{ service_accounts.signoz.uid }}"
      register: telemetry_signoz_container
      changed_when: false
      failed_when: >-
        telemetry_signoz_container.rc != 0 or
        not ((telemetry_signoz_container.stdout | from_json)[0].State.Running | bool)

    - name: Wait for the SigNoz UI API
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ signoz_ui_port }}"
        timeout: 120

    - name: Stage the SigNoz API token
      ansible.builtin.copy:
        dest: /run/platform-signoz-api.token
        content: "{{ signoz_api_token }}"
        owner: root
        group: root
        mode: "0600"
      no_log: true
      changed_when: false

    - name: Upsert SigNoz operations alert rules
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - /usr/local/libexec/platform-signoz-alerts
          - --rules
          - /etc/signoz/platform-alerts.json
          - --url
          - "http://127.0.0.1:{{ signoz_ui_port }}"
          - --token-file
          - /run/platform-signoz-api.token
      register: telemetry_signoz_alerts
      changed_when: telemetry_signoz_alerts.stdout is search('created |updated ')
      retries: 5
      delay: 10
      until: telemetry_signoz_alerts.rc == 0
  always:
    - name: Remove the staged SigNoz API token
      ansible.builtin.file:
        path: /run/platform-signoz-api.token
        state: absent
      changed_when: false
      when: signoz_api_token | default('') | length > 0

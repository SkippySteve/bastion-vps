---
- name: Install backup packages and resticprofile
  when: backup_offsite_enabled | bool
  tags: [backup]
  block:
    - name: Install restic
      ansible.builtin.apt:
        name: restic
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Download the pinned resticprofile release
      ansible.builtin.get_url:
        url: >-
          https://github.com/creativeprojects/resticprofile/releases/download/v{{ backup_resticprofile_version
          }}/resticprofile_{{ backup_resticprofile_version }}_linux_{{ preflight_platform_arch }}.tar.gz
        dest: "/usr/local/src/resticprofile_{{ backup_resticprofile_version }}_linux_{{ preflight_platform_arch }}.tar.gz"
        checksum: "sha256:{{ artifact_checksums.resticprofile[preflight_platform_arch] }}"
        owner: root
        group: root
        mode: "0644"

    - name: Create resticprofile extract and libexec directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - "/usr/local/src/resticprofile-{{ backup_resticprofile_version }}"
        - /usr/local/libexec

    - name: Extract resticprofile
      ansible.builtin.unarchive:
        src: "/usr/local/src/resticprofile_{{ backup_resticprofile_version }}_linux_{{ preflight_platform_arch }}.tar.gz"
        dest: "/usr/local/src/resticprofile-{{ backup_resticprofile_version }}"
        remote_src: true
        extra_opts:
          - --no-same-owner
        creates: "/usr/local/src/resticprofile-{{ backup_resticprofile_version }}/resticprofile"

    - name: Install the resticprofile binary
      ansible.builtin.copy:
        src: "/usr/local/src/resticprofile-{{ backup_resticprofile_version }}/resticprofile"
        dest: /usr/local/bin/resticprofile
        remote_src: true
        owner: root
        group: root
        mode: "0755"

    - name: Create backup configuration directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0700"
      loop:
        - /etc/resticprofile
        - /var/lib/platform-backup
        - "{{ backup_staging_dir | dirname }}"

    - name: Install the restic repository password
      ansible.builtin.copy:
        dest: /etc/resticprofile/password
        content: "{{ backup_restic_password }}\n"
        owner: root
        group: root
        mode: "0600"
      no_log: true

    - name: Install resticprofile configuration
      ansible.builtin.template:
        src: profiles.yaml.j2
        dest: /etc/resticprofile/profiles.yaml
        owner: root
        group: root
        mode: "0600"
      no_log: true

    - name: Install the application-consistent dump hook
      ansible.builtin.template:
        src: dump.sh.j2
        dest: /usr/local/libexec/platform-backup-dump
        owner: root
        group: root
        mode: "0750"

    - name: Install the gated restore helper
      ansible.builtin.template:
        src: restore.sh.j2
        dest: /usr/local/libexec/platform-backup-restore
        owner: root
        group: root
        mode: "0750"

    - name: Install backup systemd units
      ansible.builtin.template:
        src: "{{ item }}"
        dest: "/etc/systemd/system/{{ item | regex_replace('\\.j2$', '') }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - platform-backup.service.j2
        - platform-backup.timer.j2
        - platform-backup-check.service.j2
        - platform-backup-check.timer.j2
      notify: Reload backup units

    - name: Apply backup unit changes
      ansible.builtin.meta: flush_handlers

    - name: Enable the backup and repository-check timers
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: true
        state: started
      loop:
        - platform-backup.timer
        - platform-backup-check.timer

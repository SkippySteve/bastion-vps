          - render_signoz_casting.spec.patches[0].operations | selectattr('path', 'equalto', '/services/ingester/depends_on') | list | length == 0
          - >-
            render_signoz_casting.spec.patches[0].operations
            | selectattr('path', 'equalto', '/services/signoz-telemetrystore-clickhouse-0-0/depends_on')
            | map(attribute='value') | first

  histogram_quantile:
    amd64: "33997073eb6d82b7be4f27f9fc8ec9e28a395e0f20674d5d54bb2fa28a75488d"
    arm64: "e5605ebffa82a450ebbcdf6cf19dad546e1e40d52dbf3e03cfd2d2d5b7394211"
  silk: "9ea9c1391f9c1ba14394af68b2bd7e66bf73b664c3cee342c5a39e5b13e45398"
  libfixbuf: "106b8e1e560928a4dc91d8264326bd2463767570d77417535964f450de1f972e"
  yaf: "fb581317124a2a5064c17e211cc2a0226a41f606c2135a5a5c6f672ecf6e4c9f"

forgejo_runner_registration_token: ""
forgejo_runner_labels: "debian-13:docker://node:24-bookworm,podman-host:host"
# Same-host runner. The public HTTPS name hairpins through Traefik and can
# hang forever. Poll Forgejo on loopback. Job clone URLs still use ROOT_URL.
forgejo_runner_instance_url: "http://127.0.0.1:{{ forgejo_http_port }}/"
verify_public_https: false

# On-box product. Images come from Forgejo Packages on loopback. The
# runner never sees this account's volumes or Podman socket.
enable_scrapecast: true
scrapecast_image_tag: main
scrapecast_registry: "127.0.0.1:{{ forgejo_http_port }}"
scrapecast_image_repository: "{{ forgejo_admin_user }}/scrapecast"
scrapecast_auth_mode: "off"
# Packages read token for svc-scrapecast. Create it in Forgejo after the
# first repo exists. Empty means Ansible renders the stack but does not start it.
scrapecast_registry_pull_token: ""

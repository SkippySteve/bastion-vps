---
- name: Reload Victoria units
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart Victoria stack
  ansible.builtin.systemd_service:
    name: secure-victoria.service
    state: restarted

- name: Restart Victoria host OpenTelemetry collector
  ansible.builtin.systemd_service:
    name: otelcol-contrib.service
    state: restarted

- name: Restart Victoria Podman OpenTelemetry collectors
  ansible.builtin.systemd_service:
    name: "otelcol-podman-{{ item.value.name }}.service"
    state: restarted
  loop: "{{ service_accounts | dict2items }}"
  failed_when: false

          - render_wazuh_cert_stats.results[1].stat.mode == '0644'
          - render_wazuh_cert_stats.results[2].stat.mode == '0644'
          - render_wazuh_cert_stats.results[3].stat.mode == '0644'
          - render_wazuh_cert_stats.results[4].stat.mode == '0644'


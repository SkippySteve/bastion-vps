              'signoz-telemetrykeeper-clickhousekeeper-0': {'condition': 'service_started'},
              'signoz-telemetrystore-clickhouse-user-scripts': {'condition': 'service_started'}
            }
          - render_signoz_casting.spec.patches[0].operations | selectattr('op', 'equalto', 'remove') | map(attribute='path') | list | intersect(['/services/ingester/deploy']) | length == 1
          - render_signoz_casting.spec.patches[0].operations | selectattr('path', 'equalto', '/services/signoz-telemetrystore-clickhouse-0-0/mem_limit') | map(attribute='value') | first == '2g'
          - render_signoz_casting.spec.patches[1].target == 'deployment/telemetrystore/clickhouse/config-0-0.yaml'
          - render_signoz_casting.spec.patches[1].operations | selectattr('path', 'equalto', '/max_server_memory_usage') | map(attribute='value') | first == 1610612736
          - render_signoz_casting.spec.patches[1].operations | selectattr('path', 'equalto', '/background_pool_size') | map(attribute='value') | first == 2
          - >-
            render_signoz_casting.spec.patches[1].operations
            | selectattr('path', 'equalto', '/merge_tree')
            | map(attribute='value') | first

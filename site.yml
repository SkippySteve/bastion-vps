---
- name: Provision the Debian 13 secure service platform
  hosts: secure_vps
  become: true
  gather_facts: true
  serial: 1

  roles:
    - role: preflight
      tags: [always, preflight]
    - role: dns
      tags: [dns, setup, all]
      when: cloudflare_dns_enabled | bool
    - role: base
      tags: [base, firewall, ssh, setup, all]
    - role: platform
      tags: [platform, edge, traefik, waf, auth, authentik, forgejo, signoz, wazuh_server, setup, all]
    - role: fail2ban
      tags: [fail2ban, setup, all]
    - role: telemetry
      tags: [telemetry, alerts, otelcol, setup, all]
    - role: sensors
      tags: [sensors, suricata, zeek, silk, yaf, setup, all]
    - role: trivy
      tags: [trivy, setup, all]
    - role: wazuh_agent
      tags: [wazuh_agent, setup, all]
    - role: rustinel
      tags: [rustinel, setup, all]
      when: rustinel_enabled | bool
    - role: runner
      tags: [runner, setup, all]
    - role: scrapecast
      tags: [scrapecast, setup, all]
      when: enable_scrapecast | bool
    - role: backup
      tags: [backup, restore, setup, all]
    - role: backup_restore
      tags: [never, restore]
    - role: verify
      tags: [verify]

---
- name: Reload systemd for telemetry
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart host OpenTelemetry collector
  ansible.builtin.systemd_service:
    name: otelcol-contrib.service
    state: restarted

- name: Restart Podman OpenTelemetry collectors
  ansible.builtin.systemd_service:
    name: "otelcol-podman-{{ item.value.name }}.service"
    state: restarted
  loop: "{{ service_accounts | dict2items }}"
  failed_when: false

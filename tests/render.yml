---
- name: Render every shipped template for static validation
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../group_vars/all/main.yml
    - ../group_vars/all/vault.yml.example
  vars:
    render_root: /tmp/debian13-secure-platform-render
    base_domain: test.example.net
    ansible_default_ipv4:
      interface: eth0
      network: 192.0.2.0
      prefix: 24
    preflight_platform_arch: amd64
    wazuh_agent_has_unattended_logs: true
    backup_b2_key_id: render-key-id
    backup_b2_application_key: render-app-key
    backup_restic_password: render-restic-password-ok
    backup_b2_bucket: render-bucket
    backup_b2_endpoint: s3.us-west-004.backblazeb2.com
    traefik_dynamic_directory: "{{ render_root }}/dynamic"
    traefik_acme_storage: "{{ render_root }}/acme.json"
    traefik_acme_ca_server: https://127.0.0.1:9/directory
    platform_rootless_stack_units:
      - name: secure-edge
        account: edge
        directory: edge
        compose: compose.yml
        after: network-online.target
      - name: secure-wazuh
        account: wazuh
        directory: wazuh/upstream/single-node
        compose: compose.secure.yml
        after: network-online.target
      - name: secure-signoz
        account: signoz
        directory: signoz/pours/deployment
        compose: compose.yaml
        after: network-online.target
        compose_services:
          - signoz-signoz-0

  tasks:
    - name: Reset render output directory
      ansible.builtin.file:
        path: "{{ render_root }}"
        state: absent

    - name: Create render output directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0700"
      loop:
        - "{{ render_root }}"
        - "{{ render_root }}/dynamic"

    - name: Create the test ACME state file
      ansible.builtin.file:
        path: "{{ traefik_acme_storage }}"
        state: touch
        mode: "0600"

    - name: Render templates that do not use a loop item
      ansible.builtin.template:
        src: "{{ item.src }}"
        dest: "{{ render_root }}/{{ item.dest }}"
        mode: "0600"
      vars:
        bootstrap_admin_htpasswd: 'bootstrap:$apr1$bB8Hc9SM$6oRbSymnTDkibTWzxZLSK1'
        backup_b2_key_id: render-key-id
        backup_b2_application_key: render-app-key
        backup_restic_password: render-restic-password-ok
        backup_b2_bucket: render-bucket
        backup_b2_endpoint: s3.us-west-004.backblazeb2.com
        wazuh_stack_dir: "{{ render_root }}/wazuh-cert-test"
      loop:
        - {src: ../roles/base/templates/containers.conf.j2, dest: containers.conf}
        - {src: ../roles/base/templates/sshd-hardening.conf.j2, dest: sshd.conf}
        - {src: ../roles/base/templates/nftables.conf.j2, dest: nftables.conf}
        - {src: ../roles/base/templates/audit-platform.rules.j2, dest: audit-platform.rules}
        - {src: ../roles/base/templates/login-warning.j2, dest: login-warning}
        - {src: ../roles/base/templates/sudoers-cis.j2, dest: sudoers-cis}
        - {src: ../roles/base/templates/pwquality-cis.conf.j2, dest: pwquality-cis.conf}
        - {src: ../roles/base/templates/pwhistory-cis.conf.j2, dest: pwhistory-cis.conf}
        - {src: ../roles/base/templates/faillock-cis.conf.j2, dest: faillock-cis.conf}
        - {src: ../roles/platform/templates/traefik-compose.yml.j2, dest: traefik-compose.yml}
        - {src: ../roles/platform/templates/traefik-static.yml.j2, dest: traefik-static.yml}
        - {src: ../roles/platform/templates/traefik-dynamic.yml.j2, dest: dynamic/platform.yml}
        - {src: ../roles/platform/templates/lab-tls.cnf.j2, dest: lab-tls.cnf}
        - {src: ../roles/platform/templates/waf-compose.yml.j2, dest: waf-compose.yml}
        - {src: ../roles/platform/templates/waf-default.conf.template.j2, dest: waf.conf}
        - {src: ../roles/platform/templates/waf-crs-exclusions.conf.j2, dest: waf-crs-exclusions.conf}
        - {src: ../roles/platform/templates/crowdsec-compose.yml.j2, dest: crowdsec-compose.yml}
        - {src: ../roles/platform/templates/crowdsec-config.yaml.local.j2, dest: crowdsec-config.yaml.local}
        - {src: ../roles/platform/templates/crowdsec-appsec-acquis.yaml.j2, dest: crowdsec-appsec-acquis.yaml}
        - {src: ../roles/platform/templates/crowdsec-appsec-config.yaml.j2, dest: crowdsec-appsec-config.yaml}
        - {src: ../roles/platform/templates/crowdsec-appsec-rule-def.yaml.j2, dest: crowdsec-appsec-rule-def.yaml}
        - {src: ../roles/platform/templates/crowdsec-appsec-rules.conf.j2, dest: crowdsec-appsec-rules.conf}
        - {src: ../roles/platform/templates/authentik-compose.yml.j2, dest: authentik-compose.yml}
        - {src: ../roles/platform/templates/forgejo-compose.yml.j2, dest: forgejo-compose.yml}
        - {src: ../roles/platform/templates/signoz-casting.yml.j2, dest: signoz-casting.yml}
        - {src: ../roles/platform/templates/wazuh-compose.yml.j2, dest: wazuh-compose.yml}
        - {src: ../roles/platform/templates/wazuh-internal-users.yml.j2, dest: wazuh-internal-users.yml}
        - {src: ../roles/platform/templates/wazuh-certs.sh.j2, dest: wazuh-certs.sh}
        - {src: ../roles/telemetry/templates/host-otelcol.yml.j2, dest: host-otelcol.yml}
        - {src: ../roles/victoria/templates/compose.yml.j2, dest: victoria-compose.yml}
        - {src: ../roles/victoria/templates/vmagent.yml.j2, dest: vmagent.yml}
        - {src: ../roles/victoria/templates/tempo.yml.j2, dest: tempo.yml}
        - {src: ../roles/victoria/templates/grafana-datasources.yml.j2, dest: grafana-datasources.yml}
        - {src: ../roles/victoria/templates/grafana-dashboard-providers.yml.j2, dest: grafana-dashboard-providers.yml}
        - {src: ../roles/victoria/templates/security-events.json.j2, dest: security-events.json}
        - {src: ../roles/victoria/templates/vulnerability-compliance.json.j2, dest: vulnerability-compliance.json}
        - {src: ../roles/victoria/templates/host-otelcol.yml.j2, dest: victoria-host-otelcol.yml}
        - {src: ../roles/security_monitoring/templates/vector.yaml.j2, dest: vector.yaml}
        - {src: ../roles/sensors/templates/suricata-platform.service.j2, dest: suricata.service}
        - {src: ../roles/sensors/templates/suricata-platform.yaml.j2, dest: suricata-platform.yaml}
        - {src: ../roles/sensors/templates/zeek@.service.j2, dest: zeek.service}
        - {src: ../roles/sensors/templates/zeek.logrotate.j2, dest: zeek.logrotate}
        - {src: ../roles/sensors/templates/silk.conf.j2, dest: silk.conf}
        - {src: ../roles/sensors/templates/sensors.conf.j2, dest: sensors.conf}
        - {src: ../roles/sensors/templates/silk-rwflowpack.service.j2, dest: silk.service}
        - {src: ../roles/runner/templates/runner-config.yml.j2, dest: runner-config.yml}
        - {src: ../roles/runner/templates/forgejo-runner.service.j2, dest: runner.service}
        - {src: ../roles/base/templates/registries.conf.j2, dest: registries.conf}
        - {src: ../roles/scrapecast/templates/compose.yml.j2, dest: scrapecast-compose.yml}
        - {src: ../roles/scrapecast/templates/scrapecast.service.j2, dest: scrapecast.service}
        - {src: ../roles/scrapecast/templates/scrapecast-update.service.j2, dest: scrapecast-update.service}
        - {src: ../roles/scrapecast/templates/scrapecast-update.timer.j2, dest: scrapecast-update.timer}
        - {src: ../roles/fail2ban/templates/jail.d/platform.local.j2, dest: fail2ban-jail.local}
        - {src: ../roles/fail2ban/templates/filter.d/forgejo.conf.j2, dest: fail2ban-forgejo.conf}
        - {src: ../roles/fail2ban/templates/action.d/nftables-waf.conf.j2, dest: fail2ban-nftables-waf.conf}
        - {src: ../roles/trivy/templates/trivy-platform-scan.py.j2, dest: trivy-platform-scan}
        - {src: ../roles/wazuh_agent/templates/localfiles.xml.j2, dest: wazuh-localfiles.xml}
        - {src: ../roles/telemetry/templates/alerts.json.j2, dest: signoz-alerts.json}
        - {src: ../roles/backup/templates/profiles.yaml.j2, dest: resticprofile.yaml}
        - {src: ../roles/backup/templates/dump.sh.j2, dest: platform-backup-dump}
        - {src: ../roles/backup/templates/restore.sh.j2, dest: platform-backup-restore}
        - {src: ../roles/backup/templates/platform-backup.service.j2, dest: platform-backup.service}
        - {src: ../roles/backup/templates/platform-backup.timer.j2, dest: platform-backup.timer}
        - {src: ../roles/backup/templates/platform-backup-check.service.j2, dest: platform-backup-check.service}
        - {src: ../roles/backup/templates/platform-backup-check.timer.j2, dest: platform-backup-check.timer}

    - name: Render per-account Trivy scanner units
      ansible.builtin.template:
        src: ../roles/trivy/templates/trivy-scan.service.j2
        dest: "{{ render_root }}/trivy-scan-{{ item.value.name }}.service"
        mode: "0600"
      loop: "{{ service_accounts | dict2items }}"

    - name: Render per-account Trivy timers
      ansible.builtin.template:
        src: ../roles/trivy/templates/trivy-scan.timer.j2
        dest: "{{ render_root }}/trivy-scan-{{ item.value.name }}.timer"
        mode: "0600"
      loop: "{{ service_accounts | dict2items }}"
      loop_control:
        index_var: trivy_timer_index

    - name: Render per-account Trivy log rotation
      ansible.builtin.template:
        src: ../roles/trivy/templates/trivy-logrotate.j2
        dest: "{{ render_root }}/trivy-{{ item.value.name }}.logrotate"
        mode: "0600"
      loop: "{{ service_accounts | dict2items }}"

    - name: Render Traefik dynamic config in lab TLS mode
      ansible.builtin.template:
        src: ../roles/platform/templates/traefik-dynamic.yml.j2
        dest: "{{ render_root }}/dynamic/platform.lab.yml"
        mode: "0600"
      vars:
        traefik_acme_enabled: false
        protect_admin_apps_with_authentik: false
        bootstrap_admin_htpasswd: 'bootstrap:$apr1$bB8Hc9SM$6oRbSymnTDkibTWzxZLSK1'

    - name: Read the lab Traefik dynamic YAML
      ansible.builtin.slurp:
        src: "{{ render_root }}/dynamic/platform.lab.yml"
      register: traefik_lab_raw

    - name: Decode the lab Traefik dynamic YAML
      ansible.builtin.set_fact:
        traefik_lab_dynamic: "{{ traefik_lab_raw.content | b64decode | from_yaml }}"

    - name: Require lab routers to stay distinct mappings
      ansible.builtin.assert:
        that:
          - traefik_lab_dynamic.http.routers.authentik.tls == {}
          - traefik_lab_dynamic.http.routers.authentik.observability.tracing | bool
          - traefik_lab_dynamic.http.routers.authentik.observability.metrics | bool
          - traefik_lab_dynamic.http.routers.authentik.observability.accessLogs | bool
          - traefik_lab_dynamic.http.routers.authentik.service == "authentik"
          - traefik_lab_dynamic.http.routers.forgejo.service == "forgejo"
          - traefik_lab_dynamic.http.routers.observe.service == "victoria"
          - traefik_lab_dynamic.http.routers.security.service == "victoria"
          - traefik_lab_dynamic.http.routers.crowdsec.service == "crowdsec"
          - traefik_lab_dynamic.http.routers.crowdsec.rule == "Host(`" ~ crowdsec_fqdn ~ "`)"
          - traefik_lab_dynamic.http.routers.scrapecast.rule == "Host(`" ~ app_fqdn ~ "`)"
          - traefik_lab_dynamic.http.routers['scrapecast-www'].middlewares == ["www-to-apex", "public-chain"]
          - traefik_lab_dynamic.http.routers.observe.middlewares == ["bootstrap-admin-chain"]
          - traefik_lab_dynamic.http.routers['traefik-dashboard'] is not defined
          - traefik_lab_dynamic.tls.certificates | length == 1
          - traefik_lab_dynamic.http.middlewares['crowdsec-bouncer'].plugin['crowdsec-bouncer'].enabled | bool
          - not (traefik_lab_dynamic.http.middlewares['crowdsec-bouncer'].plugin['crowdsec-bouncer'].crowdsecAppsecEnabled | bool)
          - "'18085' in traefik_lab_dynamic.http.middlewares['crowdsec-bouncer'].plugin['crowdsec-bouncer'].crowdsecLapiHost"
          - "'17422' in traefik_lab_dynamic.http.middlewares['crowdsec-bouncer'].plugin['crowdsec-bouncer'].crowdsecAppsecHost"
          - "'crowdsec-bouncer' in traefik_lab_dynamic.http.middlewares['public-chain'].chain.middlewares"
          - "'crowdsec-bouncer' in traefik_lab_dynamic.http.middlewares['admin-chain'].chain.middlewares"
          - "'crowdsec-bouncer' in traefik_lab_dynamic.http.middlewares['bootstrap-admin-chain'].chain.middlewares"
          - traefik_lab_dynamic.http.services.crowdsec.loadBalancer.servers[0].url == "http://127.0.0.1:18092"
          - traefik_lab_dynamic.http.middlewares['security-dashboard-redirect'].redirectRegex.permanent | bool

    - name: Render Traefik static config for TLS-ALPN ACME
      ansible.builtin.template:
        src: ../roles/platform/templates/traefik-static.yml.j2
        dest: "{{ render_root }}/traefik-static.tls.yml"
        mode: "0600"
      vars:
        traefik_acme_enabled: true
        traefik_acme_challenge: tls

    - name: Render Traefik static config and Compose for DNS-01 ACME
      ansible.builtin.template:
        src: "{{ item.src }}"
        dest: "{{ render_root }}/{{ item.dest }}"
        mode: "0600"
      vars:
        traefik_acme_enabled: true
        traefik_acme_challenge: dns
        cloudflare_api_token: "render-test-token"
      loop:
        - {src: ../roles/platform/templates/traefik-static.yml.j2, dest: traefik-static.dns.yml}
        - {src: ../roles/platform/templates/traefik-compose.yml.j2, dest: traefik-compose.dns.yml}
        - {src: ../roles/platform/templates/traefik-cloudflare.env.j2, dest: cloudflare.env}

    - name: Read ACME Traefik YAML
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop:
        - "{{ render_root }}/traefik-static.tls.yml"
        - "{{ render_root }}/traefik-static.dns.yml"
        - "{{ render_root }}/traefik-compose.dns.yml"
        - "{{ render_root }}/cloudflare.env"
      register: traefik_acme_raw

    - name: Decode ACME Traefik YAML
      ansible.builtin.set_fact:
        traefik_static_tls: "{{ traefik_acme_raw.results[0].content | b64decode | from_yaml }}"
        traefik_static_dns: "{{ traefik_acme_raw.results[1].content | b64decode | from_yaml }}"
        traefik_compose_dns: "{{ traefik_acme_raw.results[2].content | b64decode | from_yaml }}"
        traefik_cloudflare_env: "{{ traefik_acme_raw.results[3].content | b64decode }}"

    - name: Require TLS-ALPN and DNS-01 ACME to stay distinct
      ansible.builtin.assert:
        that:
          - traefik_static_tls.certificatesResolvers.letsencrypt.acme.tlsChallenge == {}
          - traefik_static_tls.certificatesResolvers.letsencrypt.acme.dnsChallenge is not defined
          - traefik_static_dns.certificatesResolvers.letsencrypt.acme.dnsChallenge.provider == "cloudflare"
          - traefik_static_dns.certificatesResolvers.letsencrypt.acme.tlsChallenge is not defined
          - traefik_compose_dns.services.traefik.env_file == ["./cloudflare.env"]
          - "'CF_DNS_API_TOKEN=render-test-token' in traefik_cloudflare_env"

    - name: Render Traefik dynamic config with Authentik forward auth
      ansible.builtin.template:
        src: ../roles/platform/templates/traefik-dynamic.yml.j2
        dest: "{{ render_root }}/dynamic/platform.protect.yml"
        mode: "0600"
      vars:
        traefik_acme_enabled: false
        protect_admin_apps_with_authentik: true
        bootstrap_admin_htpasswd: 'bootstrap:$apr1$bB8Hc9SM$6oRbSymnTDkibTWzxZLSK1'

    - name: Read the forward-auth Traefik dynamic YAML
      ansible.builtin.slurp:
        src: "{{ render_root }}/dynamic/platform.protect.yml"
      register: traefik_protect_raw

    - name: Decode the forward-auth Traefik dynamic YAML
      ansible.builtin.set_fact:
        traefik_protect_dynamic: "{{ traefik_protect_raw.content | b64decode | from_yaml }}"

    - name: Require outpost callbacks to skip the WAF
      ansible.builtin.assert:
        that:
          - traefik_protect_dynamic.http.routers.observe.middlewares == ["admin-chain"]
          - traefik_protect_dynamic.http.routers.crowdsec.middlewares == ["admin-chain"]
          - traefik_protect_dynamic.http.routers['traefik-dashboard'].service == "api@internal"
          - traefik_protect_dynamic.http.services['authentik-outpost'].loadBalancer.servers[0].url == "http://127.0.0.1:19000"

    - name: Read rendered CI, scrapecast, and WAF files
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop:
        - "{{ render_root }}/forgejo-compose.yml"
        - "{{ render_root }}/runner-config.yml"
        - "{{ render_root }}/registries.conf"
        - "{{ render_root }}/waf.conf"
        - "{{ render_root }}/scrapecast-compose.yml"
        - "{{ render_root }}/waf-compose.yml"
        - "{{ render_root }}/waf-crs-exclusions.conf"
        - "{{ render_root }}/crowdsec-compose.yml"
        - "{{ render_root }}/crowdsec-config.yaml.local"
        - "{{ render_root }}/crowdsec-appsec-acquis.yaml"
        - "{{ render_root }}/crowdsec-appsec-config.yaml"
        - "{{ render_root }}/crowdsec-appsec-rule-def.yaml"
        - "{{ render_root }}/crowdsec-appsec-rules.conf"
      register: scrapecast_render_raw

    - name: Decode rendered CI, scrapecast, and WAF files
      ansible.builtin.set_fact:
        render_forgejo_compose: "{{ scrapecast_render_raw.results[0].content | b64decode | from_yaml }}"
        render_runner_config: "{{ scrapecast_render_raw.results[1].content | b64decode | from_yaml }}"
        render_registries_conf: "{{ scrapecast_render_raw.results[2].content | b64decode }}"
        render_waf_conf: "{{ scrapecast_render_raw.results[3].content | b64decode }}"
        render_scrapecast_compose: "{{ scrapecast_render_raw.results[4].content | b64decode | from_yaml }}"
        render_waf_compose: "{{ scrapecast_render_raw.results[5].content | b64decode | from_yaml }}"
        render_waf_exclusions: "{{ scrapecast_render_raw.results[6].content | b64decode }}"
        render_crowdsec_compose: "{{ scrapecast_render_raw.results[7].content | b64decode | from_yaml }}"
        render_crowdsec_config_local: "{{ scrapecast_render_raw.results[8].content | b64decode | from_yaml }}"
        render_crowdsec_appsec_acquis: "{{ scrapecast_render_raw.results[9].content | b64decode | from_yaml }}"
        render_crowdsec_appsec_config: "{{ scrapecast_render_raw.results[10].content | b64decode | from_yaml }}"
        render_crowdsec_appsec_rule_def: "{{ scrapecast_render_raw.results[11].content | b64decode | from_yaml }}"
        render_crowdsec_appsec_rules: "{{ scrapecast_render_raw.results[12].content | b64decode }}"

    - name: Read rendered sshd and nftables
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop:
        - "{{ render_root }}/sshd.conf"
        - "{{ render_root }}/nftables.conf"
      register: render_ssh_nft_raw

    - name: Decode rendered sshd and nftables
      ansible.builtin.set_fact:
        render_sshd_conf: "{{ render_ssh_nft_raw.results[0].content | b64decode }}"
        render_nftables_conf: "{{ render_ssh_nft_raw.results[1].content | b64decode }}"

    - name: Require Forgejo builtin SSH on 2222 and host OpenSSH for ops only
      ansible.builtin.assert:
        that:
          - render_forgejo_compose.services.forgejo.environment.FORGEJO__server__DISABLE_SSH == "false"
          - render_forgejo_compose.services.forgejo.environment.FORGEJO__server__START_SSH_SERVER == "true"
          - render_forgejo_compose.services.forgejo.environment.FORGEJO__server__SSH_PORT == "2222"
          - render_forgejo_compose.services.forgejo.environment.FORGEJO__server__SSH_LISTEN_PORT == "2222"
          - render_forgejo_compose.services.forgejo.environment.FORGEJO__security__REVERSE_PROXY_LIMIT == "1"
          - '"0.0.0.0:2222:2222" in render_forgejo_compose.services.forgejo.ports'
          - '"127.0.0.1:13000:3000" in render_forgejo_compose.services.forgejo.ports'
          - "'AllowUsers ops' in render_sshd_conf"
          - "'AllowUsers ops git' not in render_sshd_conf"
          - "'DisableForwarding yes' in render_sshd_conf"
          - "'Banner /etc/issue.net' in render_sshd_conf"
          - "'MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com' in render_sshd_conf"
          - "'MaxStartups 10:30:60' in render_sshd_conf"
          - "'tcp dport { 22, 2222, 443 }' in render_nftables_conf"

    - name: Confirm host Forgejo SSH passthrough files are absent
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/{{ item }}"
      register: passthrough_files
      loop:
        - ../roles/platform/tasks/forgejo_ssh.yml
        - ../roles/platform/templates/forgejo-keys.j2
        - ../roles/platform/templates/forgejo-serv.j2
        - ../roles/platform/templates/forgejo-ssh-exec.j2
        - ../roles/platform/templates/forgejo-ssh-shell.j2
        - ../roles/platform/templates/forgejo-ssh.sudoers.j2
        - ../roles/platform/templates/sshd-forgejo-git.conf.j2

    - name: Require host Forgejo SSH passthrough files to stay gone
      ansible.builtin.assert:
        that: not item.stat.exists
        fail_msg: "Passthrough leftover still present: {{ item.item }}"
      loop: "{{ passthrough_files.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Require loopback Packages, runner host mapping, and apex routing
      ansible.builtin.assert:
        that:
          - render_forgejo_compose.services.forgejo.environment.FORGEJO__packages__ENABLED == "true"
          - render_forgejo_compose.services.forgejo.environment.FORGEJO__actions__ENABLED == "true"
          - ("--add-host=" ~ git_fqdn ~ ":host-gateway") in render_runner_config.container.options
          - "'127.0.0.1:13000' in render_registries_conf"
          - "'insecure = true' in render_registries_conf"
          - ("server_name " ~ app_fqdn ~ " " ~ app_www_fqdn) in render_waf_conf
          - "'proxy_pass http://127.0.0.1:43148' in render_waf_conf"
          - "'proxy_pass http://127.0.0.1:43147' in render_waf_conf"
          - render_scrapecast_compose.services.web.ports == ["127.0.0.1:43147:43147"]
          - render_scrapecast_compose.services.scraper.ports == ["127.0.0.1:43148:43148"]

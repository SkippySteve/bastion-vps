          - -in
          - "{{ render_root }}/wazuh-cert-test/config/wazuh_indexer/certs/wazuh.indexer.pem"
          - -noout
          - -checkip
          - 127.0.0.1
      changed_when: false

    - name: Inspect generated Wazuh certificate permissions
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ render_root }}/wazuh-cert-test/config/root-ca/certs/root-ca.key"
        - "{{ render_root }}/wazuh-cert-test/config/wazuh_indexer/certs/wazuh.indexer-key.pem"
        - "{{ render_root }}/wazuh-cert-test/config/wazuh_indexer/certs/wazuh.indexer.pem"
        - "{{ render_root }}/wazuh-cert-test/config/wazuh_indexer/certs/admin-key.pem"
        - "{{ render_root }}/wazuh-cert-test/config/wazuh_dashboard/certs/wazuh.dashboard-key.pem"
      register: render_wazuh_cert_stats

    - name: Require private Wazuh keys to stay non-world-readable
      ansible.builtin.assert:
        that:
          - render_wazuh_cert_repeat.stdout | trim == ''

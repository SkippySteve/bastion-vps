          - "'rm -rf --one-file-system --' in backup_restore_src"
          - "'Backup aborted:' in backup_dump_src"
          - "'/var/lib/platform-backup/restore' in backup_restore_src"
          - "'Do not copy them onto live volumes' in backup_restore_src"
          - "'resticprofile' in backup_service_src"
          - "'role: backup' in next_work_site_src"
          - "'role: backup_restore' in next_work_site_src"
          - "'tags: [never, restore]' in next_work_site_src"
          - "'backup_restore_confirm | bool' in backup_restore_tasks_src"
          - "'import_tasks: restore.yml' not in backup_tasks_src"
          - "'backup_offsite_enabled' in preflight_tasks_src"
          - "'s3.<region>.backblazeb2.com' in preflight_tasks_src"
          - "'signoz_api_token' in telemetry_tasks_src"
          - "'platform-signoz-alerts' in telemetry_tasks_src"
          - "'Confirm the SigNoz API belongs to the running rootless container' in telemetry_tasks_src"
          - "'/var/lib/platform-wazuh/state.json' in verify_engine_tasks_src"
          - "'--verify-only' in verify_engine_tasks_src"
          - "'Refresh the Wazuh CA used for live verification' in verify_engine_tasks_src"
          - "'Keep the CrowdSec local API client on loopback' in platform_tasks_src"
          - "'local_api_credentials.yaml' in platform_tasks_src"
          - "'platform_security_rules.xml' not in verify_engine_tasks_src"
          - "'ssl.create_default_context(cafile=ca_file)' in wazuh_publish_src"
          - "'_create_unverified_context' not in wazuh_publish_src"
          - "'SSLCertVerificationError' in wazuh_publish_src"
          - "'refusing to report stale security content as published' in wazuh_publish_src"
          - "'IP:127.0.0.1' in wazuh_certs_src"
          - "'*-key.pem' in wazuh_certs_src"
          - "'chmod 640' in wazuh_certs_src"

    - name: Render Traefik dynamic, static, and otelcol with ModSecurity fallback
      ansible.builtin.template:
        src: "{{ item.src }}"
        dest: "{{ render_root }}/{{ item.dest }}"
        mode: "0600"
      vars:
        waf_provider: modsecurity
        traefik_acme_enabled: false
      loop:
        - {src: ../roles/platform/templates/traefik-dynamic.yml.j2, dest: dynamic/platform.modsec.yml}
        - {src: ../roles/platform/templates/traefik-static.yml.j2, dest: traefik-static.modsec.yml}
        - {src: ../roles/telemetry/templates/host-otelcol.yml.j2, dest: host-otelcol.modsec.yml}
        - {src: ../roles/fail2ban/templates/action.d/nftables-waf.conf.j2, dest: fail2ban-nftables-waf.modsec.conf}

    - name: Read ModSecurity fallback renderings
      ansible.builtin.slurp:
        src: "{{ render_root }}/{{ item }}"
      loop:
        - dynamic/platform.modsec.yml
        - traefik-static.modsec.yml
        - host-otelcol.modsec.yml
        - fail2ban-nftables-waf.modsec.conf
      register: modsec_fallback_raw

    - name: Decode ModSecurity fallback renderings
      ansible.builtin.set_fact:
        modsec_dynamic: "{{ modsec_fallback_raw.results[0].content | b64decode | from_yaml }}"
        modsec_static: "{{ modsec_fallback_raw.results[1].content | b64decode | from_yaml }}"
        modsec_otelcol: "{{ modsec_fallback_raw.results[2].content | b64decode | from_yaml }}"
        modsec_fail2ban: "{{ modsec_fallback_raw.results[3].content | b64decode }}"

    - name: Require ModSecurity fallback to preserve legacy proxy and scrape behaviors
      ansible.builtin.assert:
        that:
          - modsec_dynamic.http.routers.forgejo.service == "waf"
          - modsec_dynamic.http.routers.authentik.service == "waf"
          - modsec_dynamic.http.routers.observe.service == "waf"
          - modsec_dynamic.http.routers.security.service == "waf"
          - modsec_dynamic.http.services.waf.loadBalancer.servers[0].url == "http://127.0.0.1:18090"
          - "'crowdsec-bouncer' not in modsec_dynamic.http.middlewares['public-chain'].chain.middlewares"
          - modsec_static.experimental.plugins is not defined
          - modsec_otelcol.receivers.nginx.endpoint == "http://127.0.0.1:18091/nginx_status"
          - "'nginx' in modsec_otelcol.service.pipelines.metrics.receivers"
          - "'podman exec modsecurity-crs nginx -s reload' in modsec_fail2ban"

---
- name: Remove leftover host Forgejo SSH passthrough
  ansible.builtin.import_tasks: forgejo_ssh_cleanup.yml
  tags: [platform, forgejo]

- name: Define the rootless application stacks
  ansible.builtin.set_fact:
    platform_rootless_stack_units:
      - {name: secure-waf, account: waf, directory: waf, compose: compose.yml, after: "network-online.target"}
      - {name: secure-auth, account: auth, directory: auth, compose: compose.yml, after: "network-online.target"}
      - {name: secure-forgejo, account: forgejo, directory: forgejo, compose: compose.yml, after: "network-online.target"}
      - name: secure-signoz
        account: signoz
        directory: signoz/pours/deployment
        compose: compose.yaml
        after: "network-online.target"
        timeout_start_sec: 120
        # podman-compose up -d waits on healthchecks even with --no-deps.
        # Create stopped, then podman start.
        compose_services:
          - signoz-telemetrykeeper-clickhousekeeper-0
          - signoz-metastore-postgres-0
          - signoz-telemetrystore-clickhouse-user-scripts
          - signoz-telemetrystore-clickhouse-0-0
          - signoz-signoz-0
          - ingester
      - {name: secure-wazuh, account: wazuh, directory: wazuh/upstream/single-node, compose: compose.secure.yml, after: "network-online.target"}
      # Do not After= other stacks. A hung podman-compose keeps :443 down.
      - name: secure-edge
        account: edge
        directory: edge
        compose: compose.yml
        after: "network-online.target"

- name: Determine targeted platform stack units
  ansible.builtin.set_fact:
    platform_active_stack_units: >-
      {{
        platform_rootless_stack_units
        if (
          ansible_run_tags is not defined or
          'all' in ansible_run_tags or
          'platform' in ansible_run_tags or
          'setup' in ansible_run_tags
        )
        else (
          platform_rootless_stack_units
          | selectattr('account', 'in', ansible_run_tags)
          | list
          + (platform_rootless_stack_units | selectattr('account', 'equalto', 'auth') | list if 'authentik' in ansible_run_tags else [])
          + (platform_rootless_stack_units | selectattr('account', 'equalto', 'edge') | list if 'traefik' in ansible_run_tags else [])
          + (platform_rootless_stack_units | selectattr('account', 'equalto', 'wazuh') | list if ('wazuh_server' in ansible_run_tags or 'wazuh' in ansible_run_tags) else [])
        )
      }}

- name: Remember the SigNoz compose services
  ansible.builtin.set_fact:
    platform_signoz_services: "{{ (platform_rootless_stack_units | selectattr('name', 'equalto', 'secure-signoz') | first).compose_services }}"
  tags: [platform, signoz]

- name: Create application stack directories
  ansible.builtin.file:
    path: "/var/lib/{{ service_accounts[item.account].name }}/stacks/{{ item.directory }}"
    state: directory
    owner: "{{ service_accounts[item.account].name }}"
    group: "{{ service_accounts[item.account].name }}"
    mode: "0700"
  loop: >-
    {{
      [
        {'account': 'edge', 'directory': 'edge/config/dynamic'},
        {'account': 'edge', 'directory': 'edge/tls'},
        {'account': 'waf', 'directory': 'waf'},
        {'account': 'waf', 'directory': 'waf/config/acquis.d'},
        {'account': 'waf', 'directory': 'waf/config/appsec-configs'},
        {'account': 'waf', 'directory': 'waf/config/appsec-rules'},
        {'account': 'waf', 'directory': 'waf/data'},
        {'account': 'waf', 'directory': 'waf/web-ui-data'},
        {'account': 'auth', 'directory': 'auth'},
        {'account': 'forgejo', 'directory': 'forgejo'},
        {'account': 'signoz', 'directory': 'signoz'},
        {'account': 'wazuh', 'directory': 'wazuh'}
      ] | selectattr('account', 'in', (platform_active_stack_units | map(attribute='account') | list)) | list
    }}

- name: Create the Traefik ACME state file
  ansible.builtin.file:
    path: "/var/lib/{{ service_accounts.edge.name }}/stacks/edge/acme.json"
    state: touch
    access_time: preserve
    modification_time: preserve
    owner: "{{ service_accounts.edge.name }}"
    group: "{{ service_accounts.edge.name }}"
    mode: "0600"
  tags: [platform, edge, traefik]

- name: Render the lab TLS OpenSSL config
  ansible.builtin.template:
    src: lab-tls.cnf.j2
    dest: "/var/lib/{{ service_accounts.edge.name }}/stacks/edge/tls/openssl.cnf"
    owner: "{{ service_accounts.edge.name }}"
    group: "{{ service_accounts.edge.name }}"
    mode: "0600"
  when: not (traefik_acme_enabled | bool)
  notify: Restart secure edge
  tags: [platform, edge, traefik]

- name: Generate the lab TLS certificate authority
  ansible.builtin.command:
    argv:
      - /usr/bin/openssl
      - req
      - -x509
      - -newkey
      - rsa:4096
      - -sha256
      - -days
      - "825"
      - -nodes
      - -keyout
      - lab-ca.key
      - -out
      - lab-ca.pem
      - -subj
      - /CN=debian13-secure-platform lab CA
    chdir: "/var/lib/{{ service_accounts.edge.name }}/stacks/edge/tls"
    creates: lab-ca.pem
  become: true
  become_user: "{{ service_accounts.edge.name }}"
  when: not (traefik_acme_enabled | bool)
  notify: Restart secure edge
  tags: [platform, edge, traefik]

- name: Generate the lab server private key
  ansible.builtin.command:
    argv:
      - /usr/bin/openssl
      - genrsa
      - -out
      - lab-server.key
      - "2048"
    chdir: "/var/lib/{{ service_accounts.edge.name }}/stacks/edge/tls"
    creates: lab-server.key
  become: true
  become_user: "{{ service_accounts.edge.name }}"
  when: not (traefik_acme_enabled | bool)
  tags: [platform, edge, traefik]

- name: Issue the lab server certificate from the local CA
  ansible.builtin.shell: |
    set -euo pipefail
    openssl req -new -key lab-server.key -out lab-server.csr -config openssl.cnf
    openssl x509 -req -in lab-server.csr -CA lab-ca.pem -CAkey lab-ca.key \
      -CAcreateserial -out lab-server.pem -days 825 -sha256 \
      -extfile openssl.cnf -extensions v3_req
    rm -f lab-server.csr
  args:
    chdir: "/var/lib/{{ service_accounts.edge.name }}/stacks/edge/tls"
    creates: lab-server.pem
    executable: /bin/bash
  become: true
  become_user: "{{ service_accounts.edge.name }}"
  when: not (traefik_acme_enabled | bool)
  notify: Restart secure edge
  tags: [platform, edge, traefik]

- name: Fetch the lab CA onto the controller
  ansible.builtin.fetch:
    src: "/var/lib/{{ service_accounts.edge.name }}/stacks/edge/tls/lab-ca.pem"
    dest: "{{ playbook_dir }}/tls/lab-ca.pem"
    flat: true
  when: not (traefik_acme_enabled | bool)
  tags: [platform, edge, traefik]

- name: Remove Traefik Cloudflare DNS-01 credentials when unused
  ansible.builtin.file:
    path: "/var/lib/{{ service_accounts.edge.name }}/stacks/edge/cloudflare.env"
    state: absent
  when: not ((traefik_acme_enabled | bool) and (traefik_acme_challenge | default('tls') == 'dns'))
  notify: Restart secure edge
  tags: [platform, edge, traefik]

- name: Render Traefik Cloudflare DNS-01 credentials
  ansible.builtin.template:
    src: traefik-cloudflare.env.j2
    dest: "/var/lib/{{ service_accounts.edge.name }}/stacks/edge/cloudflare.env"
    owner: "{{ service_accounts.edge.name }}"
    group: "{{ service_accounts.edge.name }}"
    mode: "0600"
  when:
    - traefik_acme_enabled | bool
    - traefik_acme_challenge | default('tls') == 'dns'
  no_log: true
  notify: Restart secure edge
  tags: [platform, edge, traefik]

- name: Render edge proxy files
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "/var/lib/{{ service_accounts.edge.name }}/stacks/edge/{{ item.dest }}"
    owner: "{{ service_accounts.edge.name }}"
    group: "{{ service_accounts.edge.name }}"
    mode: "{{ item.mode | default('0600') }}"
  loop:
    - {src: traefik-compose.yml.j2, dest: compose.yml}
    - {src: traefik-static.yml.j2, dest: config/traefik.yml}
    - {src: traefik-dynamic.yml.j2, dest: config/dynamic/platform.yml}
  no_log: true
  notify: Restart secure edge
  tags: [platform, edge, traefik]

- name: Render the CrowdSec Compose definition
  ansible.builtin.template:
    src: crowdsec-compose.yml.j2
    dest: "/var/lib/{{ service_accounts.waf.name }}/stacks/waf/compose.yml"
    owner: "{{ service_accounts.waf.name }}"
    group: "{{ service_accounts.waf.name }}"
    mode: "0600"
  notify: Restart secure WAF
  when: waf_provider | default('crowdsec') == 'crowdsec'
  tags: [platform, waf]

- name: Render CrowdSec local configuration
  ansible.builtin.template:
    src: crowdsec-config.yaml.local.j2
    dest: "/var/lib/{{ service_accounts.waf.name }}/stacks/waf/config/config.yaml.local"
    owner: "{{ service_accounts.waf.name }}"
    group: "{{ service_accounts.waf.name }}"
    mode: "0644"
  notify: Restart secure WAF
  when: waf_provider | default('crowdsec') == 'crowdsec'
  tags: [platform, waf]

- name: Render CrowdSec AppSec acquisition configuration
  ansible.builtin.template:
    src: crowdsec-appsec-acquis.yaml.j2
    dest: "/var/lib/{{ service_accounts.waf.name }}/stacks/waf/config/acquis.d/appsec.yaml"
    owner: "{{ service_accounts.waf.name }}"
    group: "{{ service_accounts.waf.name }}"
    mode: "0644"
  notify: Restart secure WAF
  when: waf_provider | default('crowdsec') == 'crowdsec'
  tags: [platform, waf]

- name: Render CrowdSec AppSec platform configuration
  ansible.builtin.template:
    src: crowdsec-appsec-config.yaml.j2
    dest: "/var/lib/{{ service_accounts.waf.name }}/stacks/waf/config/appsec-configs/platform-appsec.yaml"
    owner: "{{ service_accounts.waf.name }}"
    group: "{{ service_accounts.waf.name }}"
    mode: "0644"
  notify: Restart secure WAF
  when: waf_provider | default('crowdsec') == 'crowdsec'
  tags: [platform, waf]

- name: Render CrowdSec AppSec rule definition
  ansible.builtin.template:
    src: crowdsec-appsec-rule-def.yaml.j2
    dest: "/var/lib/{{ service_accounts.waf.name }}/stacks/waf/config/appsec-rules/platform-exclusions.yaml"
    owner: "{{ service_accounts.waf.name }}"
    group: "{{ service_accounts.waf.name }}"
    mode: "0644"
  notify: Restart secure WAF
  when: waf_provider | default('crowdsec') == 'crowdsec'
  tags: [platform, waf]

- name: Render CrowdSec AppSec platform rules and exclusions
  ansible.builtin.template:
    src: crowdsec-appsec-rules.conf.j2
    dest: "{{ item }}"
    owner: "{{ service_accounts.waf.name }}"
    group: "{{ service_accounts.waf.name }}"
    mode: "0644"
  loop:
    - "/var/lib/{{ service_accounts.waf.name }}/stacks/waf/data/platform-exclusions.conf"
    - "/var/lib/{{ service_accounts.waf.name }}/stacks/waf/config/appsec-rules/platform-exclusions.conf"
  notify: Restart secure WAF
  when: waf_provider | default('crowdsec') == 'crowdsec'
  tags: [platform, waf]

- name: Create an empty WAF fail2ban deny list
  ansible.builtin.copy:
    dest: "/var/lib/{{ service_accounts.waf.name }}/stacks/waf/fail2ban-deny.conf"
    content: |
      # Managed by fail2ban. Empty until an address is banned.
    owner: "{{ service_accounts.waf.name }}"
    group: "{{ service_accounts.waf.name }}"
    mode: "0644"
    force: false
  when: waf_provider | default('crowdsec') == 'modsecurity'
  tags: [platform, waf]

- name: Render the WAF Compose definition
  ansible.builtin.template:
    src: waf-compose.yml.j2
    dest: "/var/lib/{{ service_accounts.waf.name }}/stacks/waf/compose.yml"
    owner: "{{ service_accounts.waf.name }}"
    group: "{{ service_accounts.waf.name }}"
    mode: "0600"
  notify: Restart secure WAF
  when: waf_provider | default('crowdsec') == 'modsecurity'
  tags: [platform, waf]

- name: Render the WAF nginx template for the unprivileged container user
  ansible.builtin.template:
    src: waf-default.conf.template.j2
    dest: "/var/lib/{{ service_accounts.waf.name }}/stacks/waf/default.conf.template"
    owner: "{{ service_accounts.waf.name }}"
    group: "{{ service_accounts.waf.name }}"
    mode: "0644"
  notify: Restart secure WAF
  when: waf_provider | default('crowdsec') == 'modsecurity'
  tags: [platform, waf]

- name: Render CRS exclusions for Forgejo repository file views
  ansible.builtin.template:
    src: waf-crs-exclusions.conf.j2
    dest: "/var/lib/{{ service_accounts.waf.name }}/stacks/waf/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf"
    owner: "{{ service_accounts.waf.name }}"
    group: "{{ service_accounts.waf.name }}"
    mode: "0644"
  notify: Restart secure WAF
  when: waf_provider | default('crowdsec') == 'modsecurity'
  tags: [platform, waf]

- name: Render the Authentik stack
  ansible.builtin.template:
    src: authentik-compose.yml.j2
    dest: "/var/lib/{{ service_accounts.auth.name }}/stacks/auth/compose.yml"
    owner: "{{ service_accounts.auth.name }}"
    group: "{{ service_accounts.auth.name }}"
    mode: "0600"
  no_log: true
  notify: Restart secure Authentik
  tags: [platform, auth, authentik]

- name: Render the Forgejo stack
  ansible.builtin.template:
    src: forgejo-compose.yml.j2
    dest: "/var/lib/{{ service_accounts.forgejo.name }}/stacks/forgejo/compose.yml"
    owner: "{{ service_accounts.forgejo.name }}"
    group: "{{ service_accounts.forgejo.name }}"
    mode: "0600"
  no_log: true
  notify: Restart secure Forgejo
  tags: [platform, forgejo]

- name: Create the versioned Foundry installation directory
  ansible.builtin.file:
    path: "/opt/foundry/{{ foundry_version }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [platform, signoz]

- name: Ensure the local source cache exists
  ansible.builtin.file:
    path: /usr/local/src
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [platform, signoz]

- name: Create a swap file on undersized hosts
  when:
    - allow_undersized_host | bool
    - (undersized_swap_mb | int) > 0
    - (ansible_swaptotal_mb | int) < 1024
  tags: [platform, signoz]
  block:
    - name: Allocate the undersized-host swap file
      ansible.builtin.command:
        argv:
          - /usr/bin/fallocate
          - -l
          - "{{ undersized_swap_mb }}M"
          - /swapfile
        creates: /swapfile

    - name: Restrict the swap file
      ansible.builtin.file:
        path: /swapfile
        owner: root
        group: root
        mode: "0600"

    - name: Read active swap devices
      ansible.builtin.command:
        argv: [/sbin/swapon, --show=NAME, --noheadings]
      register: platform_swap_active
      changed_when: false

    - name: Format the swap file
      ansible.builtin.command:
        argv: [/sbin/mkswap, /swapfile]
      register: platform_mkswap
      when: "'/swapfile' not in (platform_swap_active.stdout | default(''))"
      changed_when: platform_mkswap.rc == 0

    - name: Enable the swap file
      ansible.builtin.command:
        argv: [/sbin/swapon, /swapfile]
      register: platform_swapon
      when: "'/swapfile' not in (platform_swap_active.stdout | default(''))"
      changed_when: platform_swapon.rc == 0
      failed_when:
        - platform_swapon.rc != 0
        - "'already' not in (platform_swapon.stderr | default(''))"

    - name: Persist the swap file in fstab
      ansible.builtin.lineinfile:
        path: /etc/fstab
        regexp: '^/swapfile\s'
        line: '/swapfile none swap sw 0 0'

- name: Create the SigNoz user-scripts directory
  ansible.builtin.file:
    path: "/var/lib/{{ service_accounts.signoz.name }}/stacks/signoz/user-scripts"
    state: directory
    owner: "{{ service_accounts.signoz.name }}"
    group: "{{ service_accounts.signoz.name }}"
    mode: "0755"
  tags: [platform, signoz]

- name: Download histogram-quantile for ClickHouse user scripts
  ansible.builtin.get_url:
    url: "https://github.com/SigNoz/signoz/releases/download/histogram-quantile%2Fv0.0.1/histogram-quantile_linux_{{ preflight_platform_arch }}.tar.gz"
    dest: "/usr/local/src/histogram-quantile_linux_{{ preflight_platform_arch }}-0.0.1.tar.gz"
    checksum: "sha256:{{ artifact_checksums.histogram_quantile[preflight_platform_arch] }}"
    owner: root
    group: root
    mode: "0644"
  tags: [platform, signoz]

- name: Unpack histogram-quantile
  ansible.builtin.unarchive:
    src: "/usr/local/src/histogram-quantile_linux_{{ preflight_platform_arch }}-0.0.1.tar.gz"
    dest: "/var/lib/{{ service_accounts.signoz.name }}/stacks/signoz/user-scripts"
    remote_src: true
    extra_opts: [--no-same-owner]
    creates: "/var/lib/{{ service_accounts.signoz.name }}/stacks/signoz/user-scripts/histogram-quantile"
  tags: [platform, signoz]

- name: Install histogramQuantile for the Foundry user-scripts volume
  ansible.builtin.copy:
    src: "/var/lib/{{ service_accounts.signoz.name }}/stacks/signoz/user-scripts/histogram-quantile"
    dest: "/var/lib/{{ service_accounts.signoz.name }}/stacks/signoz/user-scripts/histogramQuantile"
    remote_src: true
    owner: "{{ service_accounts.signoz.name }}"
    group: "{{ service_accounts.signoz.name }}"
    mode: "0755"
  tags: [platform, signoz]

- name: Download the pinned SigNoz Foundry release
  ansible.builtin.get_url:
    url: "https://github.com/SigNoz/foundry/releases/download/v{{ foundry_version }}/foundry_linux_{{ preflight_platform_arch }}.tar.gz"
    dest: "/usr/local/src/foundry_linux_{{ preflight_platform_arch }}-{{ foundry_version }}.tar.gz"
    checksum: "sha256:{{ artifact_checksums.foundry[preflight_platform_arch] }}"
    owner: root
    group: root
    mode: "0644"
  tags: [platform, signoz]

- name: Unpack the pinned Foundry release
  ansible.builtin.unarchive:
    src: "/usr/local/src/foundry_linux_{{ preflight_platform_arch }}-{{ foundry_version }}.tar.gz"
    dest: "/opt/foundry/{{ foundry_version }}"
    remote_src: true
    extra_opts: [--strip-components=2, --no-same-owner]
    creates: "/opt/foundry/{{ foundry_version }}/foundryctl"
  tags: [platform, signoz]

- name: Link the Foundry CLI into the system path
  ansible.builtin.file:
    src: "/opt/foundry/{{ foundry_version }}/foundryctl"
    dest: /usr/local/bin/foundryctl
    state: link
    force: true
  tags: [platform, signoz]

- name: Render the pinned SigNoz casting
  ansible.builtin.template:
    src: signoz-casting.yml.j2
    dest: "/var/lib/{{ service_accounts.signoz.name }}/stacks/signoz/casting.yml"
    owner: "{{ service_accounts.signoz.name }}"
    group: "{{ service_accounts.signoz.name }}"
    mode: "0600"
  no_log: true
  register: platform_signoz_casting
  tags: [platform, signoz]

- name: Check for a previously forged SigNoz deployment
  ansible.builtin.stat:
    path: "/var/lib/{{ service_accounts.signoz.name }}/stacks/signoz/pours/deployment/compose.yaml"
  register: platform_signoz_compose
  tags: [platform, signoz]

- name: Read the previously forged SigNoz Compose
  ansible.builtin.slurp:
    src: "/var/lib/{{ service_accounts.signoz.name }}/stacks/signoz/pours/deployment/compose.yaml"
  register: platform_signoz_compose_raw
  when: platform_signoz_compose.stat.exists
  tags: [platform, signoz]

- name: List SigNoz Podman volumes
  ansible.builtin.command:
    argv:
      - /usr/bin/podman
      - volume
      - ls
      - -q
  become: true
  become_user: "{{ service_accounts.signoz.name }}"
  environment:
    HOME: "/var/lib/{{ service_accounts.signoz.name }}"
    XDG_RUNTIME_DIR: "/run/user/{{ service_accounts.signoz.uid }}"
  register: platform_signoz_volumes
  changed_when: false
  failed_when: false
  tags: [platform, signoz]

- name: Decide whether ClickHouse data must be rebuilt for one replica
  ansible.builtin.set_fact:
    platform_signoz_rebuild_store: >-
      {{
        (signoz_reset_telemetrystore | bool)
        or (
          platform_signoz_compose.stat.exists
          and (
            'telemetrystore-clickhouse-0-1' in (
              platform_signoz_compose_raw.content | default('') | b64decode
            )
            or 'service_healthy' in (
              platform_signoz_compose_raw.content | default('') | b64decode
            )
          )
        )
        or ('signoz-telemetrystore-0-1-data' in (platform_signoz_volumes.stdout_lines | default([])))
      }}
  tags: [platform, signoz]

- name: Stop SigNoz before dropping the extra ClickHouse replica
  ansible.builtin.systemd_service:
    name: secure-signoz.service
    state: stopped
  when: platform_signoz_rebuild_store | bool
  failed_when: false
  tags: [platform, signoz]

- name: Discard ClickHouse and Keeper volumes from the two-replica layout
  ansible.builtin.command:
    argv:
      - /usr/bin/podman
      - volume
      - rm
      - -f
      - signoz-telemetrystore-0-0-data
      - signoz-telemetrystore-0-1-data
      - signoz-telemetrykeeper-0-data
  become: true
  become_user: "{{ service_accounts.signoz.name }}"
  environment:
    HOME: "/var/lib/{{ service_accounts.signoz.name }}"
    XDG_RUNTIME_DIR: "/run/user/{{ service_accounts.signoz.uid }}"
  register: platform_signoz_volume_rm
  changed_when: true
  when: platform_signoz_rebuild_store | bool
  notify: Restart secure SigNoz
  tags: [platform, signoz]

- name: Forge the official SigNoz Compose deployment
  ansible.builtin.command:
    argv:
      - /usr/local/bin/foundryctl
      - forge
      - --no-ledger
      - --no-updater
      - --file
      - "/var/lib/{{ service_accounts.signoz.name }}/stacks/signoz/casting.yml"
      - --pours
      - "/var/lib/{{ service_accounts.signoz.name }}/stacks/signoz/pours"
  become: true
  become_user: "{{ service_accounts.signoz.name }}"
  environment:
    HOME: "/var/lib/{{ service_accounts.signoz.name }}"
    XDG_RUNTIME_DIR: "/run/user/{{ service_accounts.signoz.uid }}"
  when: >-
    platform_signoz_casting.changed
    or not platform_signoz_compose.stat.exists
    or (platform_signoz_rebuild_store | bool)
  changed_when: true
  notify: Restart secure SigNoz
  tags: [platform, signoz]

- name: Stop podman-compose from blocking boot on healthchecks
  ansible.builtin.replace:
    path: "/var/lib/{{ service_accounts.signoz.name }}/stacks/signoz/pours/deployment/compose.yaml"
    regexp: 'service_healthy'
    replace: 'service_started'
  notify: Restart secure SigNoz
  tags: [platform, signoz]

- name: Remember the Wazuh stack directory
  ansible.builtin.set_fact:
    wazuh_stack_dir: "/var/lib/{{ service_accounts.wazuh.name }}/stacks/wazuh/upstream/single-node"
  tags: [platform, wazuh_server, wazuh]

- name: Clone the exact Wazuh container configuration revision
  ansible.builtin.git:
    repo: https://github.com/wazuh/wazuh-docker.git
    dest: "/var/lib/{{ service_accounts.wazuh.name }}/stacks/wazuh/upstream"
    version: "{{ wazuh_docker_commit }}"
    force: true
    update: true
  become: true
  become_user: "{{ service_accounts.wazuh.name }}"
  tags: [platform, wazuh_server, wazuh]

- name: Check for a previously rendered Wazuh Compose
  ansible.builtin.stat:
    path: "{{ wazuh_stack_dir }}/compose.secure.yml"
  register: platform_wazuh_compose
  tags: [platform, wazuh_server, wazuh]

- name: Read any previously rendered Wazuh Compose
  ansible.builtin.slurp:
    src: "{{ wazuh_stack_dir }}/compose.secure.yml"
  register: platform_wazuh_compose_raw
  when: platform_wazuh_compose.stat.exists
  tags: [platform, wazuh_server, wazuh]

- name: Check for a successful Wazuh 5 volume seed
  ansible.builtin.stat:
    path: "{{ wazuh_stack_dir }}/.wazuh5-seeded"
  register: platform_wazuh_seeded
  tags: [platform, wazuh_server, wazuh]

- name: Decide whether Wazuh volumes must be discarded
  ansible.builtin.set_fact:
    platform_wazuh_reset_store: >-
      {{
        (wazuh_reset_store | default(false) | bool)
        or not platform_wazuh_seeded.stat.exists
        or (
          platform_wazuh_compose.stat.exists
          and '/var/ossec' in (platform_wazuh_compose_raw.content | default('') | b64decode)
        )
      }}
  tags: [platform, wazuh_server, wazuh]

- name: Stop Wazuh before dropping volumes
  ansible.builtin.systemd_service:
    name: secure-wazuh.service
    state: stopped
  when: platform_wazuh_reset_store | bool
  failed_when: false
  tags: [platform, wazuh_server, wazuh]

- name: List Wazuh Podman volumes
  ansible.builtin.command:
    argv:
      - /usr/bin/podman
      - volume
      - ls
      - -q
  become: true
  become_user: "{{ service_accounts.wazuh.name }}"
  environment:
    HOME: "/var/lib/{{ service_accounts.wazuh.name }}"
    XDG_RUNTIME_DIR: "/run/user/{{ service_accounts.wazuh.uid }}"
  register: platform_wazuh_volumes
  changed_when: false
  when: platform_wazuh_reset_store | bool
  tags: [platform, wazuh_server, wazuh]

- name: Discard Wazuh volumes that cannot seed under Podman
  ansible.builtin.command:
    argv: "{{ ['/usr/bin/podman', 'volume', 'rm', '-f'] + platform_wazuh_volumes.stdout_lines }}"
  become: true
  become_user: "{{ service_accounts.wazuh.name }}"
  environment:
    HOME: "/var/lib/{{ service_accounts.wazuh.name }}"
    XDG_RUNTIME_DIR: "/run/user/{{ service_accounts.wazuh.uid }}"
  when:
    - platform_wazuh_reset_store | bool
    - platform_wazuh_volumes.stdout_lines | length > 0
  changed_when: true
  notify: Restart secure Wazuh
  tags: [platform, wazuh_server, wazuh]

- name: Create Wazuh certificate directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ service_accounts.wazuh.name }}"
    group: "{{ service_accounts.wazuh.name }}"
    mode: "0750"
  loop:
    - "{{ wazuh_stack_dir }}/config/root-ca/certs"
    - "{{ wazuh_stack_dir }}/config/wazuh_indexer/certs"
    - "{{ wazuh_stack_dir }}/config/wazuh_manager/certs"
    - "{{ wazuh_stack_dir }}/config/wazuh_manager/rules"
    - "{{ wazuh_stack_dir }}/config/wazuh_dashboard/certs"
  tags: [platform, wazuh_server, wazuh]

- name: Install the Wazuh 5 certificate generator
  ansible.builtin.template:
    src: wazuh-certs.sh.j2
    dest: "{{ wazuh_stack_dir }}/wazuh-certs.sh"
    owner: "{{ service_accounts.wazuh.name }}"
    group: "{{ service_accounts.wazuh.name }}"
    mode: "0700"
  tags: [platform, wazuh_server, wazuh]

- name: Back up and remove dependent Wazuh certificates for explicit rotation
  when: wazuh_rotate_certificates | bool
  tags: [platform, wazuh_server, wazuh]
  block:
    - name: Archive existing Wazuh certificates before rotation
      ansible.builtin.archive:
        path:
          - "{{ wazuh_stack_dir }}/config/root-ca/certs"
          - "{{ wazuh_stack_dir }}/config/wazuh_indexer/certs"
          - "{{ wazuh_stack_dir }}/config/wazuh_manager/certs"
          - "{{ wazuh_stack_dir }}/config/wazuh_dashboard/certs"
        dest: "{{ wazuh_stack_dir }}/wazuh-certs-backup-{{ ansible_date_time.iso8601_basic_short }}.tar.gz"
        owner: "{{ service_accounts.wazuh.name }}"
        group: "{{ service_accounts.wazuh.name }}"
        mode: "0600"
      changed_when: true
    - name: Remove the root and dependent certificates for explicit rotation
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ wazuh_stack_dir }}/config/root-ca/certs/root-ca.pem"
        - "{{ wazuh_stack_dir }}/config/root-ca/certs/root-ca.key"
        - "{{ wazuh_stack_dir }}/config/root-ca/certs/root-ca.srl"
        - "{{ wazuh_stack_dir }}/config/wazuh_indexer/certs/admin.pem"
        - "{{ wazuh_stack_dir }}/config/wazuh_indexer/certs/admin-key.pem"
        - "{{ wazuh_stack_dir }}/config/wazuh_indexer/certs/wazuh.indexer.pem"
        - "{{ wazuh_stack_dir }}/config/wazuh_indexer/certs/wazuh.indexer-key.pem"
        - "{{ wazuh_stack_dir }}/config/wazuh_manager/certs/wazuh.manager.pem"
        - "{{ wazuh_stack_dir }}/config/wazuh_manager/certs/wazuh.manager-key.pem"
        - "{{ wazuh_stack_dir }}/config/wazuh_dashboard/certs/wazuh.dashboard.pem"
        - "{{ wazuh_stack_dir }}/config/wazuh_dashboard/certs/wazuh.dashboard-key.pem"

- name: Generate Wazuh 5 TLS certificates
  ansible.builtin.command:
    argv: ["{{ wazuh_stack_dir }}/wazuh-certs.sh"]
  register: platform_wazuh_cert_generation
  changed_when: "'generated' in (platform_wazuh_cert_generation.stdout | default(''))"
  notify: Restart secure Wazuh
  become: true
  become_user: "{{ service_accounts.wazuh.name }}"
  environment:
    HOME: "/var/lib/{{ service_accounts.wazuh.name }}"
  tags: [platform, wazuh_server, wazuh]

- name: Find Wazuh PEM files that containers bind-mount
  ansible.builtin.find:
    paths:
      - "{{ wazuh_stack_dir }}/config/root-ca/certs"
      - "{{ wazuh_stack_dir }}/config/wazuh_indexer/certs"
      - "{{ wazuh_stack_dir }}/config/wazuh_manager/certs"
      - "{{ wazuh_stack_dir }}/config/wazuh_dashboard/certs"
    patterns: "*.pem"
  register: platform_wazuh_pems
  tags: [platform, wazuh_server, wazuh]

- name: Apply least-privilege permissions to Wazuh certificates and private keys
  ansible.builtin.file:
    path: "{{ item.path }}"
    mode: "{{ '0644' if ('wazuh_dashboard/certs' in item.path or 'wazuh_indexer/certs' in item.path) else ('0640' if item.path.endswith('-key.pem') else '0644') }}"
  loop: "{{ platform_wazuh_pems.files }}"
  loop_control:
    label: "{{ item.path }}"
  notify: Restart secure Wazuh
  tags: [platform, wazuh_server, wazuh]

- name: Trust the generated Wazuh CA at the edge proxy boundary
  ansible.builtin.copy:
    src: "{{ wazuh_stack_dir }}/config/root-ca/certs/root-ca.pem"
    dest: "/var/lib/{{ service_accounts.edge.name }}/stacks/edge/config/wazuh-root-ca.pem"
    remote_src: true
    owner: "{{ service_accounts.edge.name }}"
    group: "{{ service_accounts.edge.name }}"
    mode: "0644"
  notify: Restart secure edge
  tags: [platform, wazuh_server, wazuh, edge]

- name: Trust the generated Wazuh CA at the WAF boundary
  ansible.builtin.copy:
    src: "{{ wazuh_stack_dir }}/config/root-ca/certs/root-ca.pem"
    dest: "/var/lib/{{ service_accounts.waf.name }}/stacks/waf/wazuh-root-ca.pem"
    remote_src: true
    owner: "{{ service_accounts.waf.name }}"
    group: "{{ service_accounts.waf.name }}"
    mode: "0644"
  notify: Restart secure WAF
  when: waf_provider | default('crowdsec') == 'modsecurity'
  tags: [platform, wazuh_server, wazuh, waf]

- name: Replace the Wazuh demo identities for the unprivileged indexer user
  ansible.builtin.template:
    src: wazuh-internal-users.yml.j2
    dest: "/var/lib/{{ service_accounts.wazuh.name }}/stacks/wazuh/upstream/single-node/config/wazuh_indexer/internal_users.yml"
    owner: "{{ service_accounts.wazuh.name }}"
    group: "{{ service_accounts.wazuh.name }}"
    mode: "0644"
  no_log: true
  notify: Restart secure Wazuh
  tags: [platform, wazuh_server, wazuh]

- name: Render the loopback-only Wazuh Compose definition
  ansible.builtin.template:
    src: wazuh-compose.yml.j2
    dest: "/var/lib/{{ service_accounts.wazuh.name }}/stacks/wazuh/upstream/single-node/compose.secure.yml"
    owner: "{{ service_accounts.wazuh.name }}"
    group: "{{ service_accounts.wazuh.name }}"
    mode: "0600"
  no_log: true
  notify: Restart secure Wazuh
  tags: [platform, wazuh_server, wazuh]

- name: Remember that Wazuh 5 volumes were prepared for Podman
  ansible.builtin.file:
    path: "{{ wazuh_stack_dir }}/.wazuh5-seeded"
    state: touch
    owner: "{{ service_accounts.wazuh.name }}"
    group: "{{ service_accounts.wazuh.name }}"
    mode: "0644"
  changed_when: false
  tags: [platform, wazuh_server, wazuh]

- name: Install root-managed wrappers for the rootless Compose stacks
  ansible.builtin.template:
    src: rootless-compose.service.j2
    dest: "/etc/systemd/system/{{ item.name }}.service"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ platform_active_stack_units }}"
  notify: Reload systemd
  tags: [platform, edge, traefik, waf, auth, authentik, forgejo, signoz, wazuh_server]

- name: Apply platform unit changes
  ansible.builtin.meta: flush_handlers
  tags: [platform, edge, traefik, waf, auth, authentik, forgejo, signoz, wazuh_server]

- name: Enable and start the rootless application stacks
  ansible.builtin.systemd_service:
    name: "{{ item.name }}.service"
    enabled: true
    state: started
  loop: "{{ platform_active_stack_units | rejectattr('name', 'equalto', 'secure-signoz') }}"
  loop_control:
    label: "{{ item.name }}"
  tags: [platform, edge, traefik, waf, auth, authentik, forgejo, signoz, wazuh_server]

- name: Enable SigNoz on boot
  ansible.builtin.systemd_service:
    name: secure-signoz.service
    enabled: true
  tags: [platform, signoz]

- name: Pull the Authentik image into the svc-auth store
  ansible.builtin.command:
    argv:
      - /usr/bin/podman
      - pull
      - "{{ authentik_image }}"
  become: true
  become_user: "{{ service_accounts.auth.name }}"
  environment:
    HOME: "/var/lib/{{ service_accounts.auth.name }}"
    XDG_RUNTIME_DIR: "/run/user/{{ service_accounts.auth.uid }}"
  async: 1200
  poll: 15
  register: platform_authentik_pull
  changed_when: platform_authentik_pull.stdout is search('(?i)writing manifest|copied|downloading')
  tags: [platform, auth, authentik]

- name: Recreate any Compose services the oneshot unit skipped
  ansible.builtin.command:
    argv:
      - /usr/bin/podman-compose
      - -f
      - "{{ item.compose }}"
      - up
      - -d
      - --remove-orphans
    chdir: "/var/lib/{{ service_accounts[item.account].name }}/stacks/{{ item.directory }}"
  become: true
  become_user: "{{ service_accounts[item.account].name }}"
  environment:
    HOME: "/var/lib/{{ service_accounts[item.account].name }}"
    XDG_RUNTIME_DIR: "/run/user/{{ service_accounts[item.account].uid }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ service_accounts[item.account].uid }}/bus"
  loop: "{{ platform_active_stack_units | rejectattr('name', 'equalto', 'secure-signoz') }}"
  loop_control:
    label: "{{ item.name }}"
  tags: [platform, edge, traefik, waf, auth, authentik, forgejo, signoz, wazuh_server]

- name: Create SigNoz containers without starting them
  ansible.builtin.command:
    argv: "{{ ['/usr/bin/podman-compose', '-f', 'compose.yaml', 'up', '--no-start', '--no-deps'] + platform_signoz_services }}"
    chdir: "/var/lib/{{ service_accounts.signoz.name }}/stacks/signoz/pours/deployment"
  become: true
  become_user: "{{ service_accounts.signoz.name }}"
  environment:
    HOME: "/var/lib/{{ service_accounts.signoz.name }}"
    XDG_RUNTIME_DIR: "/run/user/{{ service_accounts.signoz.uid }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ service_accounts.signoz.uid }}/bus"
  tags: [platform, signoz]

- name: Start existing SigNoz containers
  ansible.builtin.command:
    argv:
      - /usr/bin/podman
      - start
      - --all
  become: true
  become_user: "{{ service_accounts.signoz.name }}"
  environment:
    HOME: "/var/lib/{{ service_accounts.signoz.name }}"
    XDG_RUNTIME_DIR: "/run/user/{{ service_accounts.signoz.uid }}"
  tags: [platform, signoz]

- name: Mark the SigNoz unit started
  ansible.builtin.systemd_service:
    name: secure-signoz.service
    state: started
    no_block: true
  tags: [platform, signoz]

- name: Wait until ClickHouse answers queries
  ansible.builtin.command:
    argv:
      - /usr/bin/podman
      - exec
      - signoz-telemetrystore-clickhouse-0-0
      - clickhouse-client
      - --query
      - SELECT 1
  become: true
  become_user: "{{ service_accounts.signoz.name }}"
  environment:
    HOME: "/var/lib/{{ service_accounts.signoz.name }}"
    XDG_RUNTIME_DIR: "/run/user/{{ service_accounts.signoz.uid }}"
  register: platform_signoz_ch_ping
  changed_when: false
  retries: 36
  delay: 5
  until: platform_signoz_ch_ping.rc == 0
  tags: [platform, signoz]

- name: Run the SigNoz ClickHouse migrator
  ansible.builtin.command:
    argv:
      - /usr/bin/podman-compose
      - -f
      - compose.yaml
      - run
      - --rm
      - --no-deps
      - signoz-telemetrystore-migrator
    chdir: "/var/lib/{{ service_accounts.signoz.name }}/stacks/signoz/pours/deployment"
  become: true
  become_user: "{{ service_accounts.signoz.name }}"
  environment:
    HOME: "/var/lib/{{ service_accounts.signoz.name }}"
    XDG_RUNTIME_DIR: "/run/user/{{ service_accounts.signoz.uid }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ service_accounts.signoz.uid }}/bus"
  tags: [platform, signoz]

- name: Wait until SigNoz ClickHouse tables exist
  ansible.builtin.command:
    argv:
      - /usr/bin/podman
      - exec
      - signoz-telemetrystore-clickhouse-0-0
      - clickhouse-client
      - --query
      - SHOW CREATE TABLE signoz_traces.distributed_signoz_index_v3
  become: true
  become_user: "{{ service_accounts.signoz.name }}"
  environment:
    HOME: "/var/lib/{{ service_accounts.signoz.name }}"
    XDG_RUNTIME_DIR: "/run/user/{{ service_accounts.signoz.uid }}"
  register: platform_signoz_tbl
  changed_when: false
  retries: 90
  delay: 10
  until: platform_signoz_tbl.rc == 0
  tags: [platform, signoz]

- name: Wait for primary loopback services
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ item.port }}"
    delay: 1
    timeout: 600
  loop: >-
    {{
      (
        ([
          {'port': crowdsec_lapi_port, 'name': 'crowdsec-lapi', 'account': 'waf'},
          {'port': crowdsec_appsec_port, 'name': 'crowdsec-appsec', 'account': 'waf'},
          {'port': crowdsec_web_ui_port, 'name': 'crowdsec-web-ui', 'account': 'waf'}
        ] if (waf_provider | default('crowdsec') == 'crowdsec') else [
          {'port': waf_http_port, 'name': 'waf', 'account': 'waf'}
        ]) +
        [
          {'port': authentik_http_port, 'name': 'authentik', 'account': 'auth'},
          {'port': forgejo_http_port, 'name': 'forgejo', 'account': 'forgejo'},
          {'port': signoz_ui_port, 'name': 'signoz', 'account': 'signoz'},
          {'port': signoz_grpc_port, 'name': 'signoz-otlp-grpc', 'account': 'signoz'},
          {'port': signoz_http_port, 'name': 'signoz-otlp-http', 'account': 'signoz'},
          {'port': wazuh_dashboard_port, 'name': 'wazuh', 'account': 'wazuh'},
          {'port': wazuh_indexer_port, 'name': 'wazuh-indexer', 'account': 'wazuh'},
          {'port': 15500, 'name': 'wazuh-api', 'account': 'wazuh'},
          {'port': public_port, 'name': 'traefik', 'account': 'edge'}
        ]
      ) | selectattr('account', 'in', (platform_active_stack_units | map(attribute='account') | list)) | list
    }}
  loop_control:
    label: "{{ item.name }} :{{ item.port }}"
  tags: [platform, edge, traefik, waf, auth, authentik, forgejo, signoz, wazuh_server]

- name: Check registered CrowdSec machines
  ansible.builtin.command:
    argv:
      - /usr/bin/podman
      - exec
      - crowdsec
      - cscli
      - machines
      - list
      - -o
      - json
  become: true
  become_user: "{{ service_accounts.waf.name }}"
  environment:
    HOME: "/var/lib/{{ service_accounts.waf.name }}"
    XDG_RUNTIME_DIR: "/run/user/{{ service_accounts.waf.uid }}"
  register: platform_crowdsec_machines
  changed_when: false
  when:
    - waf_provider | default('crowdsec') == 'crowdsec'
    - "'waf' in (platform_active_stack_units | map(attribute='account') | list)"
  tags: [platform, waf]

- name: Register the CrowdSec Web UI machine account
  ansible.builtin.command:
    argv:
      - /usr/bin/podman
      - exec
      - crowdsec
      - cscli
      - machines
      - add
      - crowdsec-web-ui
      - --password
      - "{{ crowdsec_web_ui_api_key }}"
      - -f
      - /dev/null
  become: true
  become_user: "{{ service_accounts.waf.name }}"
  environment:
    HOME: "/var/lib/{{ service_accounts.waf.name }}"
    XDG_RUNTIME_DIR: "/run/user/{{ service_accounts.waf.uid }}"
  when:
    - waf_provider | default('crowdsec') == 'crowdsec'
    - "'waf' in (platform_active_stack_units | map(attribute='account') | list)"
    - "'crowdsec-web-ui' not in (platform_crowdsec_machines.stdout | default('[]'))"
  no_log: true
  tags: [platform, waf]

- name: Wire the Wazuh manager indexer connector
  ansible.builtin.import_tasks: wazuh_indexer.yml
  tags: [platform, wazuh_server, wazuh]

- name: Replace the default Wazuh server API password
  ansible.builtin.import_tasks: wazuh_api.yml
  tags: [platform, wazuh_server, wazuh]

- name: Configure the embedded Authentik outpost
  ansible.builtin.import_tasks: authentik_outpost.yml
  tags: [platform, auth, authentik]

- name: Resolve the Forgejo command inside the pinned container image
  ansible.builtin.command:
    argv:
      - /usr/bin/podman
      - exec
      - forgejo
      - /bin/sh
      - -ec
      - command -v forgejo || command -v gitea
  become: true
  become_user: "{{ service_accounts.forgejo.name }}"
  environment:
    HOME: "/var/lib/{{ service_accounts.forgejo.name }}"
    XDG_RUNTIME_DIR: "/run/user/{{ service_accounts.forgejo.uid }}"
  register: platform_forgejo_cli
  changed_when: false
  tags: [platform, forgejo]

- name: Check whether the Forgejo administrator exists
  ansible.builtin.command:
    argv:
      - /usr/bin/podman
      - exec
      - forgejo
      - "{{ platform_forgejo_cli.stdout | trim }}"
      - admin
      - user
      - list
  become: true
  become_user: "{{ service_accounts.forgejo.name }}"
  environment:
    HOME: "/var/lib/{{ service_accounts.forgejo.name }}"
    XDG_RUNTIME_DIR: "/run/user/{{ service_accounts.forgejo.uid }}"
  register: platform_forgejo_users
  changed_when: false
  no_log: true
  tags: [platform, forgejo]

- name: Create the initial Forgejo administrator
  ansible.builtin.command:
    argv:
      - /usr/bin/podman
      - exec
      - forgejo
      - "{{ platform_forgejo_cli.stdout | trim }}"
      - admin
      - user
      - create
      - --username
      - "{{ forgejo_admin_user }}"
      - --password
      - "{{ forgejo_admin_password }}"
      - --email
      - "{{ forgejo_admin_email }}"
      - --admin
      - --must-change-password=false
  become: true
  become_user: "{{ service_accounts.forgejo.name }}"
  environment:
    HOME: "/var/lib/{{ service_accounts.forgejo.name }}"
    XDG_RUNTIME_DIR: "/run/user/{{ service_accounts.forgejo.uid }}"
  when: forgejo_admin_user not in platform_forgejo_users.stdout
  changed_when: true
  no_log: true
  tags: [platform, forgejo]

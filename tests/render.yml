          - "'pg_dump' in backup_dump_src"
          - "'forgejo-data.tar' in backup_dump_src"
          - "'/var/lib/gitea' in backup_dump_src"
          - "'acme.json' in backup_dump_src"
          - "'BACKUP DATABASE' in backup_dump_src"
          - "'export_clickhouse_archive' in backup_dump_src"
          - "'podman cp' not in backup_dump_src"
          - "'wazuh-indexer-data.tar' in backup_dump_src"
          - "'wazuh-stack-config.tar' in backup_dump_src"
